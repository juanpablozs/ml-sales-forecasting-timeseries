version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: ml_sales
      MYSQL_USER: mluser
      MYSQL_PASSWORD: mlpass
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
  api:
    build: ./api
    depends_on:
      - db
    ports:
      - '8000:8000'
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=mluser
      - MYSQL_PASSWORD=mlpass
      - MYSQL_DATABASE=ml_sales
    restart: unless-stopped
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports

volumes:
  db_data:
